<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — Página no encontrada · Carlos Jaime López Martínez</title>
<meta name="description" content="La página que buscas no existe o cambió de dirección.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060a">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/sections.css">
<style>
  .notfound { min-block-size: 100svh; display: grid; place-items: center; padding-block: var(--sp-9); }
  .notfound__inner { display: grid; gap: var(--sp-5); justify-items: start; max-width: 44ch; }
  .notfound__code {
    font-family: var(--font-display);
    font-size: clamp(4.5rem, 20vw, 10rem);
    line-height: 0.9;
    letter-spacing: -0.04em;
  }
  .notfound__code em { font-style: italic; color: var(--champagne); }
</style>
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="ambient__rules"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="ambient__glow ambient__glow--a"></div>
  <div class="ambient__glow ambient__glow--b"></div>
  <div class="ambient__noise"></div>
</div>

<main class="notfound">
  <div class="shell notfound__inner">
    <p class="eyebrow">Error 404</p>
    <p class="notfound__code">Página <em>perdida</em></p>
    <p class="section-lead">
      La ruta que buscas se movió, cambió de nombre o nunca estuvo aquí.
      Vuelve al inicio para seguir explorando el portafolio.
    </p>
    <a class="btn btn--primary" href="/"><span class="btn__label">Volver al inicio</span></a>
  </div>
</main>

</body>
</html>
