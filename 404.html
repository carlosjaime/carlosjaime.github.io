<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — Página no encontrada · Carlos Jaime López Martínez</title>
<meta name="description" content="La página que buscas no existe o cambió de dirección.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060a">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/sections.css">
<style>
  .notfound {
    min-block-size: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding-block: var(--sp-9);
  }
  .notfound__code {
    font-family: var(--font-display);
    font-size: clamp(5rem, 22vw, 12rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.06em;
    background: var(--gradient-brand);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .notfound__inner { display: grid; gap: var(--sp-5); justify-items: center; }
</style>
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="ambient__grid"></div>
  <div class="ambient__orb ambient__orb--a"></div>
  <div class="ambient__orb ambient__orb--b"></div>
  <div class="ambient__noise"></div>
</div>

<main class="notfound">
  <div class="shell notfound__inner">
    <p class="eyebrow">Error 404</p>
    <p class="notfound__code">404</p>
    <h1 class="section-title">Esta ruta no existe</h1>
    <p class="section-lead">
      La página que buscas se movió, cambió de nombre o nunca estuvo aquí.
      Vuelve al inicio para seguir explorando el portafolio.
    </p>
    <a class="btn btn--primary" href="/">Volver al inicio</a>
  </div>
</main>

</body>
</html>
